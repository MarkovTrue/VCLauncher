<rect x="137" y="177" width="272" height="192" rx="20" fill="none" stroke="#FB923C" stroke-width="11" opacity="0.9"/>
<path d="M210.22 197.32 L210.22 348.68 L335.78 273 Z" fill="#FB923C" stroke="#FB923C" stroke-width="6" stroke-linejoin="round" opacity="0.85"/>
