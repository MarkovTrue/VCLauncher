<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<!-- split-квадрат cyan|orange; под разделителем один цвет (cyan); play слегка объёмный -->
<defs>
<clipPath id="frame"><rect x="24" y="24" width="464" height="464" rx="76"/></clipPath>
<linearGradient id="pl" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DFE2E7"/>
</linearGradient>
<filter id="ps" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
</filter>
</defs>
<g clip-path="url(#frame)">
<rect x="24" y="24" width="237" height="464" fill="#22D3EE"/>
<rect x="261" y="24" width="227" height="464" fill="#FB923C"/>
<rect x="251" y="24" width="10" height="464" fill="#121212" fill-opacity="0.6"/>
</g>
<g filter="url(#ps)">
<polygon points="164.35,103.41 164.35,408.59 420.70,256" fill="#121212" fill-opacity="0.6"/>
<polygon points="174.35,121 174.35,391 401.15,256" fill="url(#pl)"/>
</g>
</svg>
